services:
  quanjian:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 浏览器端 AK 在构建期内联进前端，需在 .env 中提供
        NEXT_PUBLIC_BAIDU_BROWSER_AK: ${NEXT_PUBLIC_BAIDU_BROWSER_AK:-}
    image: ghcr.io/chunge-php/quanjian:local
    container_name: quanjian
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3010
      HOSTNAME: 0.0.0.0
    ports:
      - '3010:3010'
    volumes:
      # API 响应磁盘缓存（二级缓存），重启不丢
      - ./data/cache:/app/data/cache
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3010/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
