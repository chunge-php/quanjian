name: Bug 报告
description: 功能异常、结果错误、部署失败
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 输入地址「……」
        2. 点击「开始体检」
        3. 进度停在「算路」阶段 / 报错「……」
    validations:
      required: true
  - type: input
    id: center
    attributes:
      label: 体检中心点（如涉及）
      placeholder: lng=106.2277 lat=29.5921 或地址
  - type: dropdown
    id: mode
    attributes:
      label: 运行方式
      options: [pnpm dev, pnpm build && pnpm start, Docker, 其他]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      description: 操作系统 / Node 版本 / 浏览器；**不要粘贴任何 AK**
      placeholder: Ubuntu 22.04, Node 20.14, Chrome 128
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 终端输出或浏览器控制台，请先移除 ak= 参数
      render: shell
